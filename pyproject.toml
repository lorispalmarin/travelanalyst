[project]
name = "travelanalyst"
version = "0.1.0"
description = "Server MCP e assistente per le informazioni di viaggio di Viaggiare Sicuri"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastmcp>=4,<5",  # 4.x richiede mcp>=2: vedi nota in assistant/mcp_tools.py
    "httpx>=0.27",
    "numpy>=1.26",   # l'indice semantico è una matrice in memoria, non un vector database
    "openai>=1.40",  # embedding delle query; il resto del modello passa da langchain-openai
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "python-dotenv>=1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: richiede la fonte reale (escludi con -m 'not network')",
    "llm: chiama il modello e consuma credito (escludi con -m 'not llm')",
]

[project.scripts]
viaggiaresicuri-mcp = "viaggiaresicuri_mcp.server:main"
travelanalyst = "assistant.cli:main"
travelanalyst-web = "assistant.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["viaggiaresicuri_mcp", "assistant"]

# Senza questo un'installazione non editabile porta solo i .py: la pagina della UI e l'indice
# semantico sparirebbero, e il guasto si vedrebbe solo in container.
[tool.setuptools.package-data]
assistant = ["static/*"]
viaggiaresicuri_mcp = ["data/*"]
