[project]
name = "travelanalyst"
version = "0.1.0"
description = "Server MCP e assistente per le informazioni di viaggio di Viaggiare Sicuri"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1",
]

[project.optional-dependencies]
server = ["fastmcp>=4,<5", "uvicorn>=0.30"]
assistant = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "mcp>=1.26,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: richiede la fonte reale (escludi con -m 'not network')",
    "llm: chiama il modello e consuma credito (escludi con -m 'not llm')",
]

[project.scripts]
viaggiaresicuri-mcp = "viaggiaresicuri_mcp.server:main"
travelanalyst = "assistant.cli:main"
travelanalyst-web = "assistant.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["viaggiaresicuri_mcp", "assistant"]

# Senza questo un'installazione non editabile porta solo i .py e la pagina della UI sparirebbe:
# un guasto che si vede solo in container.
[tool.setuptools.package-data]
assistant = ["static/*"]
